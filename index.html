
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Animation</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: radial-gradient(circle, #20205a, #080814);
  color: white;
  font-family: Arial, sans-serif;
}
h1 {
  color: #00eaff;
  text-shadow: 0 0 15px #00eaff;
}
.scene {
  width: 200px;
  height: 200px;
  perspective: 700px;
}
.cube {
  width: 120px;
  height: 120px;
  position: relative;
  margin: 40px;
  transform-style: preserve-3d;
  animation: rotate 6s infinite linear;
}
.face {
  position: absolute;
  width: 120px;
  height: 120px;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 2px solid #7df9ff;
  background: linear-gradient(135deg, #00eaffaa, #7b2ff788);
  box-shadow: inset 0 0 20px #00eaff66, 0 0 20px #00eaff55;
  font-size: 28px;
  font-weight: bold;
}
.front { transform: translateZ(60px); }
.back { transform: rotateY(180deg) translateZ(60px); }
.right { transform: rotateY(90deg) translateZ(60px); }
.left { transform: rotateY(-90deg) translateZ(60px); }
.top { transform: rotateX(90deg) translateZ(60px); }
.bottom { transform: rotateX(-90deg) translateZ(60px); }
@keyframes rotate {
  from { transform: rotateX(-25deg) rotateY(0); }
  to { transform: rotateX(335deg) rotateY(360deg); }
}
p {
  color: #b8caff;
  letter-spacing: 3px;
  font-size: 12px;
}
</style>
</head>
<body>
<h1>MY 3D WORLD</h1>
<div class="scene">
  <div class="cube">
    <div class="face front">3D</div>
    <div class="face back">AI</div>
    <div class="face right">★</div>
    <div class="face left">✦</div>
    <div class="face top">∞</div>
    <div class="face bottom">GO</div>
  </div>
</div>
<p>CREATED WITH CODE</p>
</body>
</html>
