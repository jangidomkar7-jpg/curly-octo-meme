
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My 3D Animation World</title>
<style>
body {
  margin: 0;
  background: #080814;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #00eaff; margin: 18px 5px; }
#view {
  width: 100%;
  height: 58vh;
  display: block;
}
.controls { padding: 12px; }
button, select {
  padding: 12px;
  margin: 5px;
  border-radius: 8px;
  border: 1px solid #00eaff;
  background: #151535;
  color: white;
  font-size: 15px;
}
#status { color: #b8caff; padding: 10px; }
</style>
</head>
<body>
<h1>MY 3D WORLD</h1>
<canvas id="view"></canvas>

<div class="controls">
  <p>Choose an available animation</p>
  <select id="animations">
    <option value="">Loading character...</option>
  </select>
  <br>
  <button id="play">▶ Play</button>
  <button id="stop">⏸ Stop</button>
  <button id="reset">↻ Reset</button>
</div>
<div id="status">Loading 3D character...</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const canvas = document.getElementById('view');
const status = document.getElementById('status');
const picker = document.getElementById('animations');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080814);

const camera = new THREE.PerspectiveCamera(
  45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000
);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xffffff, 0x333355, 2));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(3, 5, 4);
scene.add(light);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x17172e })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

let mixer = null;
let actions = [];
let currentAction = null;
let model = null;

const loader = new GLTFLoader();

loader.load(
  './free_animated_male_character_in_blender.glb',
  (gltf) => {
    model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= box.min.y;

    const maxSize = Math.max(size.x, size.y, size.z);
    if (maxSize > 0) {
      model.scale.setScalar(2 / maxSize);
    }

    camera.position.set(0, 1.1, 3.5);
    camera.lookAt(0, 0.9, 0);

    mixer = new THREE.AnimationMixer(model);
    actions = gltf.animations.map((clip) =>
      mixer.clipAction(clip)
    );

    picker.innerHTML = '';

    gltf.animations.forEach((clip, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent =
        clip.name + ' (' + clip.duration.toFixed(1) + ' sec)';
      picker.appendChild(option);
    });

    if (actions.length) {
      currentAction = actions[0];
      currentAction.play();
      status.textContent =
        'Character loaded! Choose an available animation.';
    } else {
      status.textContent =
        'Character loaded, but no animations were found.';
    }
  },
  undefined,
  (error) => {
    console.error(error);
    status.textContent =
      'Could not load character. Check the GLB filename and upload location.';
  }
);

picker.addEventListener('change', () => {
  if (!mixer || picker.value === '') return;
  if (currentAction) currentAction.stop();
  currentAction = actions[Number(picker.value)];
  currentAction.reset().play();
});

document.getElementById('play').onclick = () => {
  if (currentAction) currentAction.reset().play();
};

document.getElementById('stop').onclick = () => {
  if (currentAction) currentAction.stop();
};

document.getElementById('reset').onclick = () => {
  if (!model) return;
  model.rotation.set(0, 0, 0);
  camera.position.set(0, 1.1, 3.5);
  camera.lookAt(0, 0.9, 0);
};

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
}
animate();

function resize() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
</script>
</body>
</html>
